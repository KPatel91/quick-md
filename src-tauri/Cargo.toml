[package]
name = "quick-md"
version = "0.1.0"
description = "A fast, minimalist Markdown reader for macOS"
authors = ["Krish Patel"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "quick_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
window-vibrancy = "0.8"
comrak = { version = "0.56", default-features = false, features = ["syntect-fancy"] }
notify-debouncer-mini = "0.7"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
